    <h3>
      <font color="#006600" size="3">Functions:</font>
    </h3>
    <p>
      <img align="left" src="../assets/UED/new-a.jpg" width="23" height="24">
      <b>New.</b> This one is pretty self explanatory, it creates a new level.<br clear="left">
    </p>
    <p>
      <font color="#000000"><img align="left" src="../assets/UED/open-b.jpg" width="24" height="24">
      <b>Open.</b> This button is used to open an existing level from your 
      Unreal/UT Maps folder. Any level with a .unr suffix can be opened.&#160;</font>
    </p>
    <p>
      &#160;
    </p>
    <p>
      <font color="#000000"><img align="left" src="../assets/UED/save-c.jpg" width="24" height="22">
      <b>Save.</b> This button will save the current level under it's current 
      filename.</font>
    </p>
    <p>
      <img align="left" src="../assets/UED/undo-d.jpg" width="24" height="24">
      <b>Undo.</b> This button is used to undo the last operation, or 
      operations. You cannot undo operations made prior to rebuilding your 
      level. Once a level has been rebuilt, you can only undo operations made 
      after the rebuild.&#160;<br clear="left">
    </p>
    <p>
      <img align="left" src="../assets/UED/redo-e.jpg" width="23" height="25">
      <b>Redo.</b> This will allow you to redo an operation if you click the 
      undo button one to many times.<br clear="left">
    </p>
    <p>
      <img align="left" src="../assets/UED/search-f.jpg" width="25" height="25">
      <b>Search for Actors.</b> Use this button to find specific Actors in 
      your level. Every Actor has a corresponding name associated with it as 
      shown above. You can search by Name, Event, or Tag. Once the Actor is 
      displayed on the left hand side under &quot;Names&quot; double click it and all 
      the viewports will center on the Actor. Great for finding Actors in 
      larger maps.<br clear="left"><img border="0" src="../assets/UED/searchactors.gif" width="504" height="277">
    </p>
    <p>
      <img align="left" src="../assets/UED/actor-g.jpg" width="23" height="25">
      <b>Actor Class Browser.</b> Use this button to browse different &quot;Actors&quot; 
      which can be placed into your level. An Actor is any object you place 
      into your map. Select your Actor, then right click in the 3D viewport 
      and add the actor from the pop up menu.
    </p>
    <p>
      <img border="0" src="../assets/UED/actorclass1.gif" width="253" height="396">
      
    </p>
    <p>
      <img align="left" src="../assets/UED/group-h.jpg" width="23" height="22">
      <b>Group Browser.</b> All Actors and Brushes can be managed by using the 
      Group Bowser. Use this to easily select and modify a user defined group. 
      Highlight a set of Actors you want to be grouped together in any of the 
      viewports. Next click the Group Browser button. Next click the New Group 
      button and name it. Finally click the Add Selected Actors to Group 
      button. In the future you can activate that group of brushes by going to 
      the Group Browser, selecting the group name then clicking the Select 
      Actors in Group button.<br clear="left"><img border="0" src="../assets/UED/a_groupbrow.gif" width="257" height="196">
    </p>
    <p>
      <img align="left" src="../assets/UED/music-i.jpg" width="22" height="25">
      <b>Music Browser.</b> Use the Music Browser to select music to insert 
      music into any level. Also has the ability to import music in many 
      different formats as seen above. The onboard Galaxy Sound Viewport can 
      handle all the above file types. Use <a href="http://dl.fileplanet.com/dl/dl.asp?planetunreal/uedlab/modtracker.zip"><font color="#008000"><u>ModPlug 
      Tracker</u></font></a> to make your own music! Unfortunately the Unreal 
      Engine does not and probably will not support MP3's.&#160;<br clear="left"><img border="0" src="../assets/UED/musicbrow.gif" width="223" height="225">&#160;&#160;&#160; 
      <img border="0" src="../assets/UED/musicimport.gif" width="246" height="138">
    </p>
    <p>
      <img align="left" src="../assets/UED/sound-j.jpg" width="24" height="24">
      <b>Sound Browser.</b> The Sound Browser is used to insert various sound 
      effects to add sounds for a richer gaming experience. Make your own 
      custom sounds and import them into your map.&#160; As long as they are a .wav 
      file you are all set. Remember that .wav files can become very large. 
      Avoid using large .wav files because the Unreal Engine will have a tough 
      time with them. I have had a large .wav file not play at all. Very 
      useful for importing custom sounds for lifts, doors, environments and 
      the such.
    </p>
    <p>
      <img border="0" src="../assets/UED/soundbrowser.gif" width="230" height="301">
      
    </p>
    <p>
      &#160;
    </p>
    <p>
      <img align="left" src="../assets/UED/tex-k.jpg" width="23" height="26">
      <b>Texture Browser.</b> The Texture Browser is used to apply textures to 
      all surfaces in your level. You can also import your own images and 
      create your own texture package. The current supported texture import 
      specs are : PCX format, 256 colors. As quoted by Tim Sweeney: &quot;<font face="Times New Roman,Times,Times NewRoman">Unreal 
      texture dimensions may be any powers of two from 1 to 1024. Textures 
      need not be square. For example, many of the textures in Unreal are 
      128x128, 256x128, and 256x256. Unreal's software rendering code supports 
      textures of any size from 1x1 up to 1024x1024.&quot;</font> There are a 
      few ways you can texture and object. Highlight the surface you want to 
      texture then click on a texture in the texture browser. That will add 
      the texture to the surface you highlighted. OR, you can select the 
      texture you want to use in the texture browser then hold down the ALT 
      key on your keyboard and right click the surface in the 3D viewport. 
      This method is quick way to apply textures. Also an excellent way to 
      REMOVE a texture from a map is to highlight the texture in the texture 
      browser then press &quot;Q&quot; on your keyboard. Then rebuild the map and save. 
      That hint should save you some woes down the road.
    </p>
    <p>
      <img border="0" src="../assets/UED/texbrowser1.gif" width="276" height="337">
      
    </p>
    <h3>
      <font color="#006600">&#160;</font>
    </h3>
    <p>
      <img align="left" src="../assets/UED/mesh-l.jpg" width="23" height="21">
      <b>Mesh Browser.</b> Objects within the Unreal Engine use a Mesh to 
      provide a skin and/or animation for a graphical representation. All 
      meshes can be displayed through the Mesh Browser.
    </p>
    <p>
      <img border="0" src="../assets/UED/meshbrowser1.gif" width="246" height="301">
      <br clear="left">
      
    </p>
    <p>
      <img align="left" src="../assets/UED/2d-m.jpg" width="22" height="23">
      <b>2D Shape Editor.</b> One of the most important editors used for 
      creating complex and non-standard Brushes. The 2D shaper has evolved 
      greatly with UnrealED2.
    </p>
    <p>
      <img border="0" src="../assets/UED/a_2dshaper.gif" width="628" height="402">
      <br clear="left">
      
    </p>
    <p>
      <img align="left" src="../assets/UED/script-n.jpg" width="22" height="23">
      <b>Unreal Script Editor.</b> Use this editor to manipulate scripts 
      already used in the Unreal Engine or create your own from scratch. Every 
      actor in your level can be modified through the use of scripts. You can 
      even create your own classes from scratch. If you want to dabble in 
      code, this is the place to start.
    </p>
    <p>
      Go to <a href="http://www.planetunreal.com/chimeric/"><font color="#008000"><u>Chimeric</u></font></a> 
      to get started with UScript.
    </p>
    <p>
      <img border="0" src="../assets/UED/scriptedit.gif" width="553" height="325">
      
    </p>
    <p>
      <br clear="left">
      
    </p>
    <p>
      <img align="left" src="../assets/UED/ac-prop-o.jpg" width="22" height="25">
      <b>Actor Properties.</b> Another extremely important interface for 
      configuring the advanced properties of an Actor or Brush. Notice all of 
      the configurable aspects of this example actor. Tweaking these settings 
      is where it is at.
    </p>
    <p>
      Example usage: Let us use a light as an example. This is the interface 
      you would use to change the color, radius and brightness of a light - 
      just to name a few.
    </p>
    <p>
      <img border="0" src="../assets/UED/cameraprop.gif" width="244" height="302">
      
    </p>
    <p>
      <img align="left" src="../assets/UED/sur-prop-p.jpg" width="23" height="21">
      <b>Surface Properties.</b> Used to configure the properties of a 
      surface. Surfaces can be scaled, panned and rotated using this 
      interface. All Flags for textures can be modified as well. In order to 
      see changes made to a flag on a texture you must rebuild first. 
      Highlight a surface (or surfaces) in the 3D viewport then click the 
      Surface Properties button. You can also right click on a surface then 
      choose properties from the pop up menu.
    </p>
    <p>
      <img border="0" src="../assets/UED/surfprop1.gif" width="353" height="294">
      <img border="0" src="../assets/UED/surfprop2.gif" width="352" height="294">
      <br clear="left">
      
    </p>
    <p>
      <img align="left" src="../assets/UED/bld-geo-q.jpg" width="24" height="24">
      <b>Build Geometry.</b> This button will only rebuild the geometry. Use 
      this to rebuild quickly and save time by avoiding a sometimes lengthy 
      rebuild process on larger maps.<br clear="left">
    </p>
    <p>
      <img align="left" src="../assets/UED/bld-lts-r.jpg" width="22" height="23">
      <b>Build Lighting.</b> &#160;This button will rebuild the lighting only.<br clear="left">
    </p>
    <p>
      <img align="left" src="../assets/UED/bld-pths-s.jpg" width="25" height="25">
      <b>Build Paths.</b> This button builds the Path Node network. Use the 
      Actor Class Browser to add path nodes for the Bot AI. In order for bots 
      to function properly you must lay path nodes then build the paths. 
      Otherwise the bots will stand in place - NOT a good thing<br clear="left">
    </p>
    <p>
      <img align="left" src="../assets/UED/bld-all-t.jpg" width="23" height="24">
      <b>Build All.</b> This button builds all as defined by the current build 
      settings<br clear="left">
    </p>
    <p>
      <img align="left" src="../assets/UED/bld-opt-u.jpg" width="24" height="23">
      <b>Build Options.</b> &#160;
    </p>
    <p>
      Use this button to access the interface for selecting the various build 
      options: Lighting, BSP, Geometry and Paths. The Create Path Network 
      button will prompt the editor to automatically add in path nodes for the 
      bots. The editor will make it best guess as at laying the Nodes. This is 
      not the best method for Path Noding and usually needs a lot of 
      debugging. The Stats tab will give in in depth information including 
      BSP, Zones, Lights and Geometry.
    </p>
    <p>
      Thanks to <font color="#008000">Warren Marshall</font> for the following 
      explanations:
    </p>
    <p>
      <font color="#008000" size="2">Portals Cut All</font><font size="2">: </font><font face="Times New Roman,Times,Times NewRoman" size="2">Defines 
      how aggressively portal brushes cut the BSP. If you find that water 
      zones and such aren't getting created properly, try moving this slider 
      up a little. Most of the time you don't have to touch it ...</font>
    </p>
    <p>
      <font color="#008000" face="Times New Roman,Times,Times NewRoman" size="2">Balance 
      Tree</font><font face="Times New Roman,Times,Times NewRoman" size="2">: 
      You can choose how you want the BSP compiler to prioritize the polys...<br>less 
      cuts or more balance in the tree. The default value is fine 99.99999% of 
      the time ...</font>
    </p>
    <p>
      <font color="#008000" face="Times New Roman,Times,Times NewRoman" size="2">Build 
      Visibility Zones</font><font face="Times New Roman,Times,Times NewRoman" size="2">: 
      Do not change this setting!</font>
    </p>
    <p>
      <img border="0" src="../assets/UED/buildoptions1.gif" width="359" height="523">
      
    </p>
    <p>
      <br clear="left">
      
    </p>
    <p>
      <img align="left" src="../assets/UED/play-v.jpg" width="23" height="25">
      <b>Play Level.</b> This will play your map straight out of the editor. 
      The editor automatically saves your map before playing under the name 
      &quot;autoplay&quot; (without an extension). This in essence creates a backup of 
      your map in case of disaster.<br clear="left">
    </p>
